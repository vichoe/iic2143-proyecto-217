# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
 
  activerecord:
    models:
      user:
        one: "usuario"
        other: "usuarios"
    attributes:
      user:
        name: "Nombre"
        email: "Correo electrónico"
        password: "Contraseña"
        password_confirmation: "Confirmación de contraseña"
        current_password: "Contraseña actual"
        city: "Ciudad"
        bio: "Biografía"
        avatar: "Foto de perfil"
        remember_me: "Recordarme"
      book:
        available_from: "Disponible desde"
        available_until: "Disponible hasta"
      exchange_request:
        start_date: "Fecha de inicio"
        end_date: "Fecha de término"
 
  errors:
    messages:
      blank: "no puede estar en blanco"
      taken: "ya está en uso"
      invalid: "no es válido"
      confirmation: "no coincide con %{attribute}"
      too_short:
        one: "debe tener al menos 1 carácter"
        other: "debe tener al menos %{count} caracteres"
      too_long:
        one: "debe tener como máximo 1 carácter"
        other: "debe tener como máximo %{count} caracteres"
